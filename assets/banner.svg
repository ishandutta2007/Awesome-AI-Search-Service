<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    
    <linearGradient id="text-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="accent-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.0"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="350" fill="url(#bg-gradient)" rx="16"/>

  <!-- Dynamic / Animated Mesh Background Elements (Behind text) -->
  <g opacity="0.25">
    <circle cx="150" cy="100" r="180" fill="url(#accent-glow)">
      <animate attributeName="cx" values="150;200;150" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="100;150;100" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1050" cy="250" r="220" fill="url(#accent-glow)">
      <animate attributeName="cx" values="1050;980;1050" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="250;200;250" dur="11s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Vector Grid & Floating Data Nodes (Subtle Animated Background Pattern) -->
  <g stroke="#ffffff" stroke-opacity="0.08" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70"/>
    <line x1="0" y1="140" x2="1200" y2="140"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
    
    <line x1="200" y1="0" x2="200" y2="350"/>
    <line x1="400" y1="0" x2="400" y2="350"/>
    <line x1="600" y1="0" x2="600" y2="350"/>
    <line x1="800" y1="0" x2="800" y2="350"/>
    <line x1="1000" y1="0" x2="1000" y2="350"/>
  </g>

  <!-- Animated Floating Pulse Nodes -->
  <g>
    <circle cx="200" cy="140" r="4" fill="#38bdf8" opacity="0.8">
      <animate attributeName="r" values="3;7;3" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="800" cy="70" r="5" fill="#818cf8" opacity="0.8">
      <animate attributeName="r" values="4;8;4" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;1;0.5" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1000" cy="210" r="4" fill="#c084fc" opacity="0.8">
      <animate attributeName="r" values="3;6;3" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.9;0.4" dur="3.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Foreground Title and Subtitle (Guaranteed Crisp & Unobscured) -->
  <g text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <!-- Icon / Badge Graphic -->
    <g transform="translate(600, 75)">
      <circle cx="0" cy="0" r="32" fill="#1e1b4b" stroke="url(#text-gradient)" stroke-width="3" filter="url(#glow)"/>
      <path d="M-10 -10 L6 6 M6 -10 L-10 6 M10 10 L16 16" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="-2" cy="-2" r="10" fill="none" stroke="#c084fc" stroke-width="3"/>
    </g>

    <!-- Main Title -->
    <text x="600" y="165" font-size="46" font-weight="800" fill="url(#text-gradient)" letter-spacing="0.5">
      Awesome AI Search Service
    </text>

    <!-- Subtitle -->
    <text x="600" y="215" font-size="20" font-weight="400" fill="#94a3b8" letter-spacing="0.2">
      Vector Search • Hybrid Retrieval • Semantic Ranking • Neural Search
    </text>

    <!-- Feature Pills in Foreground (Below Text) -->
    <g transform="translate(600, 275)" font-size="13" font-weight="600" fill="#e2e8f0">
      <!-- Pill 1 -->
      <g transform="translate(-240, 0)">
        <rect x="-70" y="-16" width="140" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
        <text x="0" y="5" fill="#38bdf8">🚀 SaaS &amp; Open-Source</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(0, 0)">
        <rect x="-75" y="-16" width="150" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
        <text x="0" y="5" fill="#818cf8">⚡ Vector Databases</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(240, 0)">
        <rect x="-70" y="-16" width="140" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
        <text x="0" y="5" fill="#c084fc">🔍 Semantic Ranking</text>
      </g>
    </g>
  </g>
</svg>
